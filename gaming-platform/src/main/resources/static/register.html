<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Gaming Event Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <span class="logo-icon">⚡</span> GamePass
      </a>
      <ul class="nav-links" id="nav-links"></ul>
      <div class="nav-btn-group" id="nav-auth-section"></div>
    </div>
  </header>

  <main class="container">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Create Account</h1>
          <p class="auth-subtitle">Register to discover, book, and compete in tournaments</p>
        </div>

        <form id="register-form" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name / Gamer Tag</label>
            <input 
              type="text" 
              id="reg-name" 
              class="form-control" 
              placeholder="e.g. PhoenixGamer" 
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input 
              type="email" 
              id="reg-email" 
              class="form-control" 
              placeholder="e.g. phoenix@gaming.com" 
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <input 
              type="password" 
              id="reg-password" 
              class="form-control" 
              placeholder="Create a strong password" 
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-role">Account Type</label>
            <select id="reg-role" class="form-control">
              <option value="USER">Gamer / Attendee (Book & Attend Events)</option>
              <option value="ADMIN">Platform Admin (Manage Tournaments & Sales)</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">
            Create Gamer Account 🎮
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Login here</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Gaming Event Ticketing and Registration Platform.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
