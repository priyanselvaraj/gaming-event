spring.application.name=gaming-event-platform

# Database: MySQL (Database: gaming)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gaming?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fallback: In-Memory H2 database (uncomment if running without MySQL)
# spring.datasource.url=jdbc:h2:mem:gaming;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate auto table creation
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server port (supports Render's PORT environment variable)
server.port=${PORT:8080}

# ---------------------------------------------------------------
# Email (SMTP) - used for login OTP + login notification emails
# Set these as environment variables (never commit real passwords):
#   MAIL_USERNAME = your Gmail address
#   MAIL_PASSWORD = Gmail "App Password" (16 chars, needs 2-Step Verification)
# If MAIL_USERNAME is empty, emails are NOT sent; the OTP is printed in
# the backend console instead (handy for local development).
# ---------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@gamepass.local}}
app.mail.brand=GamePass

# OTP settings
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.resend-seconds=30

# Optional: change the seeded demo account emails so OTP reaches a real inbox
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@gaming.com}
app.seed.user-email=${SEED_USER_EMAIL:alex@gaming.com}
